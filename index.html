<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Lung Hero - Final Prototype</title>
    <style>
        /* --- CSS RESET & FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; background-color: #87CEEB; }
        
        /* 🚨 CRITICAL FIX: The 3D Canvas MUST stay in the back */
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh; }

        /* --- MAIN MENU --- */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
            z-index: 200; transition: opacity 0.5s ease;
        }
        .menu-box {
            background: rgba(20, 30, 48, 0.9); padding: 50px; border-radius: 15px;
            text-align: center; color: white; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .menu-box h1 { color: #f1c40f; margin: 0 0 10px 0; font-size: 40px; }
        
        #btn-play {
            width: 100%; padding: 15px; margin-top: 20px; font-size: 20px; font-weight: bold;
            background: #555; /* Starts gray while loading */
            color: white; border: none; border-radius: 10px; cursor: not-allowed; transition: all 0.3s;
        }
        #btn-play.ready {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            cursor: pointer; box-shadow: 0 5px 15px rgba(58, 123, 213, 0.4);
        }
        #btn-play.ready:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(58,123,213,0.6); }

        /* --- IN-GAME HUD --- */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: none; pointer-events: none; }
        
        #stats-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 10px; color: white; backdrop-filter: blur(5px);
        }
        #oxy-bar-bg { width: 200px; height: 20px; background: #333; border: 2px solid white; border-radius: 5px; overflow: hidden;}
        #oxy-bar { width: 0%; height: 100%; background: cyan; transition: width 0.1s; }

        #sensor-ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); padding: 15px 30px; border-radius: 20px;
            width: 350px; text-align: center; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #breath-slider { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="main-menu">
        <div class="menu-box">
            <h1>SUPER LUNG HERO</h1>
            <p>Digital Respiratory Rehab</p>
            <button id="btn-play">LOADING ASSETS...</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="stats-panel">
            <h2 style="margin:0 0 10px 0; color:#f1c40f;">SCORE: <span id="score">0</span></h2>
            <div id="oxy-bar-bg"><div id="oxy-bar"></div></div>
        </div>
        <div id="sensor-ui">
            <div style="display:flex; justify-content:space-between; font-weight:bold; color:#333; margin-bottom:10px;">
                <span style="color:#3498db;">⬅ INHALE</span><span style="color:#e74c3c;">EXHALE ➡</span>
            </div>
            <input type="range" id="breath-slider" min="-100" max="100" value="0">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- GAME STATE & UI DOM ---
        let gameState = 'MENU';
        let oxygen = 0;
        let score = 0;
        let boatModel = null;
        const obstacles = [];

        const mainMenu = document.getElementById('main-menu');
        const gameUI = document.getElementById('game-ui');
        const btnPlay = document.getElementById('btn-play');
        const slider = document.getElementById('breath-slider');
        const oxyBar = document.getElementById('oxy-bar');
        const scoreText = document.getElementById('score');

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 300);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const clock = new THREE.Clock();

        // --- LIGHTING & ENVIRONMENT ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xfffaeb, 1.2);
        sun.position.set(100, 200, 50);
        sun.castShadow = true;
        sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 500;
        sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
        sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
        scene.add(sun);

        const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 1500), new THREE.MeshStandardMaterial({ color: 0x1ca3ec, flatShading: true }));
        water.rotation.x = -Math.PI / 2; water.position.z = -500; water.receiveShadow = true;
        scene.add(water);

        const bankMat = new THREE.MeshStandardMaterial({ color: 0xedc9af, roughness: 0.9, flatShading: true });
        const rightBank = new THREE.Mesh(new THREE.PlaneGeometry(200, 1500), bankMat);
        rightBank.rotation.x = -Math.PI / 2; rightBank.position.set(130, 0.2, -500); rightBank.receiveShadow = true;
        scene.add(rightBank);

        const leftBank = new THREE.Mesh(new THREE.PlaneGeometry(200, 1500), bankMat);
        leftBank.rotation.x = -Math.PI / 2; leftBank.position.set(-130, 0.2, -500); leftBank.receiveShadow = true;
        scene.add(leftBank);

        // --- ASSET LOADER ---
        const gltfLoader = new GLTFLoader();
        const loadedModels = {};
        const filesToLoad = [
            { id: 'boat', url: './assets/models/boat-row-small.glb' },
            { id: 'tower', url: './assets/models/tower-watch.glb' },
            { id: 'palm', url: './assets/models/palm-detailed-straight.glb' },
            { id: 'grass', url: './assets/models/grass-patch.glb' },
            { id: 'dock', url: './assets/models/structure-platform-dock.glb' },
            { id: 'barrel', url: './assets/models/barrel.glb' }
        ];

        let loadedCount = 0;

        filesToLoad.forEach(item => {
            gltfLoader.load(item.url, (gltf) => {
                const model = gltf.scene;
                model.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
                
                loadedModels[item.id] = model;
                loadedCount++;

                // When everything is loaded, build the world and unlock the PLAY button
                if (loadedCount === filesToLoad.length) {
                    buildWorld();
                    btnPlay.innerText = "START MISSION";
                    btnPlay.classList.add("ready");
                    btnPlay.disabled = false;
                }
            }, undefined, (err) => console.error("Error loading:", item.url, err));
        });

        function buildWorld() {
            // 1. Setup Boat
            boatModel = loadedModels['boat'].clone();
            boatModel.scale.set(4, 4, 4);
            boatModel.rotation.y = Math.PI; // Face forward
            scene.add(boatModel);

            // 2. Right Bank Scenery
            for (let i = 0; i < 40; i++) {
                const zPos = -Math.random() * 800;
                const rand = Math.random();
                let prop;
                if (rand < 0.3) { prop = loadedModels['tower'].clone(); prop.scale.set(3,3,3); prop.position.set(45 + Math.random()*20, 0, zPos); }
                else if (rand < 0.6) { prop = loadedModels['palm'].clone(); prop.scale.set(3.5,3.5,3.5); prop.position.set(35 + Math.random()*20, 0, zPos); }
                else if (rand < 0.8) { prop = loadedModels['grass'].clone(); prop.scale.set(5,5,5); prop.position.set(35 + Math.random()*30, 0, zPos); }
                else { prop = loadedModels['dock'].clone(); prop.scale.set(3,3,3); prop.position.set(28, 0.5, zPos); }
                
                prop.rotation.y = Math.random() * Math.PI * 2;
                scene.add(prop);
            }

            // 3. Left Bank Scenery
            for (let i = 0; i < 30; i++) {
                const prop = Math.random() > 0.5 ? loadedModels['palm'].clone() : loadedModels['grass'].clone();
                prop.scale.set(3.5, 3.5, 3.5);
                prop.position.set(-35 - Math.random() * 30, 0, -Math.random() * 800);
                scene.add(prop);
            }

            // 4. Obstacles
            for (let z = -80; z >= -600; z -= 80) {
                const barrel = loadedModels['barrel'].clone();
                barrel.scale.set(4, 4, 4);
                barrel.position.set((Math.random() - 0.5) * 20, 0, z);
                scene.add(barrel);
                obstacles.push(barrel);
            }
        }

        // --- BUTTON LISTENER ---
        btnPlay.addEventListener('click', () => {
            if (!btnPlay.classList.contains("ready")) return; // Prevent clicks if not loaded
            
            mainMenu.style.opacity = '0';
            setTimeout(() => {
                mainMenu.style.display = 'none';
                gameUI.style.display = 'block';
                gameState = 'PLAYING';
            }, 500);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const sensorVal = parseInt(slider.value);

            if (boatModel) { // Only animate if boat is loaded
                // Boat Bobbing
                boatModel.position.y = Math.sin(time * 2) * 0.15 + 0.5;
                boatModel.rotation.z = Math.cos(time * 1) * 0.03;
                boatModel.rotation.x = Math.sin(time * 1.5) * 0.03;

                if (gameState === 'MENU') {
                    // Cinematic rotation
                    camera.position.set(boatModel.position.x + Math.sin(time * 0.5) * 20, 8, boatModel.position.z + Math.cos(time * 0.5) * 20);
                    camera.lookAt(boatModel.position);
                } 
                else if (gameState === 'PLAYING') {
                    // Mechanics
                    if (sensorVal > 0 && oxygen > 0) {
                        oxygen -= sensorVal * 0.01;
                        boatModel.position.z -= sensorVal * 0.02;
                    } else if (sensorVal < 0) {
                        oxygen = Math.min(100, oxygen + Math.abs(sensorVal) * 0.02);
                    }
                    
                    oxyBar.style.width = `${oxygen}%`;
                    
                    if (Math.abs(sensorVal) > 0) slider.value = sensorVal > 0 ? sensorVal - 1 : sensorVal + 1;

                    // Collision Detection
                    for (let i = obstacles.length - 1; i >= 0; i--) {
                        const obs = obstacles[i];
                        const dist = Math.sqrt(Math.pow(boatModel.position.x - obs.position.x, 2) + Math.pow(boatModel.position.z - obs.position.z, 2));

                        if (dist < 4) { 
                            if (sensorVal > 60) {
                                scene.remove(obs);
                                obstacles.splice(i, 1);
                                score += 100;
                                scoreText.innerText = score;
                            } else {
                                boatModel.position.z += 0.5; // Bump back
                            }
                        }
                    }

                    // Chase Camera
                    const idealPos = new THREE.Vector3(0, 8, 20).add(boatModel.position);
                    const idealLook = new THREE.Vector3(0, 2, -10).add(boatModel.position);
                    camera.position.lerp(idealPos, 0.1);
                    camera.lookAt(idealLook);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
